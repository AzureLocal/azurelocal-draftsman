# Azure DevOps Pipeline Trigger for azurelocal-draftsman
# Governed centrally in HCS Platform Engineering

trigger:
  branches:
    include:
      - main
      - master
      - feature/*

pr:
  branches:
    include:
      - main
      - master

resources:
  repositories:
    - repository: platform
      type: git
      name: Platform Engineering/platform

extends:
  template: .ado/pipelines/reusable/ts-web-app-ci.yml@platform
  parameters:
    buildScript: 'build'
